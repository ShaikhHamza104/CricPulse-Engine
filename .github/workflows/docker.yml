name: Docker Build & Verification

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build & Smoke Test Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ipl-analytics-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Container Smoke Test
        run: |
          echo "Starting container in background..."
          docker run -d --name ipl-api-test -p 8000:8000 ipl-analytics-api:test
          
          echo "Waiting for FastAPI application to initialize..."
          for i in {1..15}; do
            if curl -s http://localhost:8000/health | grep -q "online"; then
              echo "✅ Container is healthy and responding to /health!"
              docker stop ipl-api-test
              docker rm ipl-api-test
              exit 0
            fi
            sleep 2
          done

          echo "❌ Container failed to respond within 30 seconds. Container logs:"
          docker logs ipl-api-test
          docker stop ipl-api-test
          docker rm ipl-api-test
          exit 1
