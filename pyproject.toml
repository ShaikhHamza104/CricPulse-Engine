[project]
name = "ipl-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohd Hamza Shaikh", email = "kmohdhamza10@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.2",
    "sqlalchemy>=2.1.6",
    "starlette>=1.10.0",
    "uvicorn[standard]>=0.54.0",
]
[dependency-groups]
dev = [
    "marimo>=0.25.2",
    "pandas-stubs~=3.1.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "httpx>=0.28.1",
]

[project.scripts]
ipl-api = "ipl_api:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
